<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% assign here = page.url %}
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="logo">D</span>
        <span class="brand-name">DONGGEON LEE</span>
      </a>
      <button class="nav-toggle" aria-label="메뉴" onclick="document.body.classList.toggle('nav-open')">☰</button>
      <nav class="menu">
        <div class="menu-group">
          <a href="{{ '/' | relative_url }}" {% if here == '/' %}class="on"{% endif %}>About Me</a>
          <a href="{{ '/experience/' | relative_url }}" {% if here contains '/experience/' %}class="on"{% endif %}>Experience</a>
          <a href="{{ '/education/' | relative_url }}" {% if here contains '/education/' %}class="on"{% endif %}>Education</a>
          <a href="{{ '/contact/' | relative_url }}" {% if here contains '/contact/' %}class="on"{% endif %}>Contact</a>
        </div>
        <span class="menu-divider"></span>
        <div class="menu-group">
          <a href="{{ '/projects/' | relative_url }}" {% if here contains '/projects/' %}class="on"{% endif %}>Projects</a>
          <a href="{{ '/awards/' | relative_url }}" {% if here contains '/awards/' %}class="on"{% endif %}>Awards</a>
          <a href="{{ '/activities/' | relative_url }}" {% if here contains '/activities/' %}class="on"{% endif %}>Activities</a>
          <a href="{{ '/blog/' | relative_url }}" {% if here contains '/blog/' or page.layout == 'post' %}class="on"{% endif %}>Blog</a>
          <a href="{{ '/gallery/' | relative_url }}" {% if here contains '/gallery/' %}class="on"{% endif %}>Gallery</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      © {{ 'now' | date: "%Y" }} {{ site.author.name }} · <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a> · <a href="https://github.com/{{ site.author.github }}">GitHub</a>
    </div>
  </footer>
</body>
</html>
