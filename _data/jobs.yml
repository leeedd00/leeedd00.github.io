- title: 물류 · 리테일테크 백엔드 개발자 (Python / FastAPI)
  why: Keeping 백엔드를 FastAPI · SQLAlchemy · PostgreSQL로 직접 설계하고 구현했습니다. 재고 도메인을 이해하는 백엔드 개발자로 성장하고 있습니다.
- title: 물류 시스템 개발자 (WMS / ERP / 물류 SI)
  why: 유통물류학과 컴퓨터공학을 복수전공했습니다. 현장의 업무 흐름과 시스템 구조를 모두 아는 개발자를 목표로 합니다.
- title: SCM · 물류기획
  why: 전공 지식과 ADsP · SQLD 기반 데이터 분석 역량, 그리고 재고관리 시스템을 직접 만들어 본 경험으로 데이터에 근거한 기획을 지향합니다.
- title: 수요기획 · 재고관리 (Demand Planning / Inventory Control)
  why: 재고 부족 · 소비기한 임박 감지와 발주 초안 자동 생성 로직을 설계한 경험이 그대로 이어지는 직무입니다.
