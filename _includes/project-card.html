<a class="card" href="{{ include.p.url | relative_url }}">
  <div class="card-img">
    {% if include.p.thumbnail %}<img src="{{ include.p.thumbnail | relative_url }}" alt="{{ include.p.title }}" loading="lazy">{% endif %}
    {% if include.p.roles %}<span class="badge">{{ include.p.roles | join: ", " }}</span>{% endif %}
  </div>
  <div class="card-body">
    <p class="tags">{% for s in include.p.stack limit: 5 %}<span class="tag">{{ s }}</span>{% endfor %}</p>
    <h3>{{ include.p.title }}</h3>
    <p>{{ include.p.summary }}</p>
  </div>
</a>
